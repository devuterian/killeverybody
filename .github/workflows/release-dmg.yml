name: Release DMG

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 태그와 앱 버전 확인
        run: |
          set -euo pipefail
          PBX="${GITHUB_WORKSPACE}/KillEverybodyApp/KillEverybodyApp.xcodeproj/project.pbxproj"
          APP_VERSION=$(grep -m1 'MARKETING_VERSION = ' "${PBX}" | sed 's/.*MARKETING_VERSION = \(.*\);/\1/' | tr -d ' ')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "${APP_VERSION}" != "${TAG_VERSION}" ]; then
            echo "::error::태그 ${GITHUB_REF_NAME}와 앱 버전 ${APP_VERSION}이 다릅니다."
            exit 1
          fi

      - name: Build app + CLI (Release, unsigned)
        run: |
          set -euo pipefail
          DERIVED="${RUNNER_TEMP}/DerivedData"
          xcodebuild \
            -project KillEverybodyApp/KillEverybodyApp.xcodeproj \
            -scheme KillEverybodyApp \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath "${DERIVED}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          xcodebuild \
            -project KillEverybodyApp/KillEverybodyApp.xcodeproj \
            -scheme KillEverybodyCLI \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath "${DERIVED}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          APP="${DERIVED}/Build/Products/Release/killeverybody.app"
          if [ ! -d "${APP}" ]; then
            echo "Expected app at ${APP}" >&2
            exit 1
          fi
          CLI="${DERIVED}/Build/Products/Release/killeverybody-cli"
          if [ ! -x "${CLI}" ]; then
            echo "Expected CLI at ${CLI}" >&2
            exit 1
          fi
          echo "APP_PATH=${APP}" >> "${GITHUB_ENV}"
          echo "CLI_PATH=${CLI}" >> "${GITHUB_ENV}"

      - name: CLI dry-run (release smoke)
        run: |
          set -euo pipefail
          "${CLI_PATH}" --dry-run --json | head -c 8000
          echo
          "${CLI_PATH}" --aggressive --dry-run --json | head -c 4000
          echo

      - name: Create DMG
        run: |
          set -euo pipefail
          STAGING="${RUNNER_TEMP}/dmg_stage"
          rm -rf "${STAGING}"
          mkdir -p "${STAGING}"
          cp -R "${APP_PATH}" "${STAGING}/"
          cp "${CLI_PATH}" "${STAGING}/killeverybody-cli"
          chmod a+x "${STAGING}/killeverybody-cli"
          ln -sf /Applications "${STAGING}/Applications"
          DMG="${GITHUB_WORKSPACE}/KillEverybody-macOS.dmg"
          rm -f "${DMG}"
          hdiutil create \
            -volname "killeverybody" \
            -fs HFS+ \
            -srcfolder "${STAGING}" \
            -ov \
            -format UDZO \
            "${DMG}"
          ls -la "${DMG}"

      - name: Sparkle appcast (서명)
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SPARKLE_PRIVATE_KEY}" ]; then
            echo "::error::GitHub 저장소 secret \`SPARKLE_PRIVATE_KEY\`가 없습니다. CONTRIBUTING.md(Sparkle)를 참고하세요."
            exit 1
          fi
          RESOLVED="${GITHUB_WORKSPACE}/KillEverybodyApp/KillEverybodyApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
          SPARKLE_VERSION=$(jq -r '.pins[] | select(.identity == "sparkle") | .state.version' "${RESOLVED}")
          if [ -z "${SPARKLE_VERSION}" ] || [ "${SPARKLE_VERSION}" = "null" ]; then
            echo "::error::Package.resolved에서 Sparkle 버전을 찾지 못했습니다."
            exit 1
          fi
          SPARKLE_DIR="${RUNNER_TEMP}/sparkle"
          ARCHIVES="${RUNNER_TEMP}/sparkle_archives"
          mkdir -p "${SPARKLE_DIR}" "${ARCHIVES}"
          curl -fsSL -o "${SPARKLE_DIR}/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          tar -xJf "${SPARKLE_DIR}/sparkle.tar.xz" -C "${SPARKLE_DIR}" ./bin/generate_appcast
          chmod +x "${SPARKLE_DIR}/bin/generate_appcast"
          DMG="${GITHUB_WORKSPACE}/KillEverybody-macOS.dmg"
          cp "${DMG}" "${ARCHIVES}/"
          TAG="${GITHUB_REF_NAME}"
          OUT="${GITHUB_WORKSPACE}/appcast.xml"
          APPCAST_LOG="${RUNNER_TEMP}/generate_appcast.log"
          printf '%s\n' "${SPARKLE_PRIVATE_KEY}" | \
            "${SPARKLE_DIR}/bin/generate_appcast" \
              --ed-key-file - \
              --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/" \
              --link "https://github.com/${GITHUB_REPOSITORY}" \
              --maximum-versions 1 \
              --maximum-deltas 0 \
              --disable-signing-warning \
              -o "${OUT}" \
              "${ARCHIVES}" 2>&1 | tee "${APPCAST_LOG}"
          if grep -q 'does not match key EdDSA' "${APPCAST_LOG}"; then
            echo "::error::SPARKLE_PRIVATE_KEY가 앱의 SUPublicEDKey와 맞지 않습니다."
            exit 1
          fi
          xmllint --noout "${OUT}"
          grep -q 'sparkle:edSignature=' "${OUT}"
          grep -q 'length=' "${OUT}"
          grep -q "releases/download/${TAG}/KillEverybody-macOS.dmg" "${OUT}"
          echo "---- appcast.xml ----"
          cat "${OUT}"

      - name: 릴리즈 노트 조립 (CHANGELOG + 안내)
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          OUT="${GITHUB_WORKSPACE}/release-notes.md"
          TMP="${RUNNER_TEMP}/changelog-section.md"
          awk -v ver="$VER" '$0 == "## " ver { p=1; next } /^## / && p { exit } p' CHANGELOG.md > "${TMP}" || true
          {
            echo "### 이번에 바뀐 점"
            echo ""
            if [ -s "${TMP}" ] && grep -q '^- ' "${TMP}"; then
              cat "${TMP}"
            else
              echo "- (이 태그용 항목이 CHANGELOG에 없어요. [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)를 봐 주세요.)"
            fi
            echo ""
            echo "---"
            echo ""
            echo "**설치**"
            echo "1. \`KillEverybody-macOS.dmg\`를 받아 연 다음 \`killeverybody.app\`을 **응용 프로그램**으로 옮기면 끝이에요."
            echo "2. (선택) 같은 DMG 안의 \`killeverybody-cli\`는 터미널용입니다. 예: \`/Volumes/killeverybody/killeverybody-cli --dry-run\` (기본은 목록만, \`--execute --yes\`일 때만 SIGKILL). PATH에 두려면 \`/usr/local/bin\` 등으로 복사하세요."
            echo "3. 처음엔 보안 창이 뜰 수 있어요. **우클릭 → 열기**로 한 번 열어 주거나, **시스템 설정 → 개인 정보 보호 및 보안**에서 허용해 주세요."
          } > "${OUT}"

      - name: GitHub Release에 DMG 업로드
        uses: softprops/action-gh-release@v2
        with:
          files: |
            KillEverybody-macOS.dmg
            appcast.xml
          generate_release_notes: true
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
